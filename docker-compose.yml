services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: budget
      POSTGRES_DB: budget
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget -d budget"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
      DATABASE_URL: postgresql+psycopg2://budget:budget@db:5432/budget
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "flask --app wsgi.py db upgrade && gunicorn --bind 0.0.0.0:8000 wsgi:app"

volumes:
  pgdata:
